name: Build toolchains

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: Build only this toolchain group (empty = all)
        default: ""
      only:
        description: Build only this package or host id (empty = all)
        default: ""
      llvm_version:
        description: LLVM version
        default: "20.1.8"
      release_tag:
        description: Upload to this release tag (empty = the latest release)
        default: ""

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: python3 scripts/common.py matrix --toolchain "${{ inputs.toolchain }}" --only "${{ inputs.only }}"

  build:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules /usr/share/swift /opt/microsoft /opt/az /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      - name: Download and extract LLVM source
        if: matrix.toolchain == 'clang'
        shell: bash
        run: |
          curl -fsSL -o llvm-src.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ inputs.llvm_version }}/llvm-project-${{ inputs.llvm_version }}.src.tar.xz"
          mkdir llvm-src
          if [ "$RUNNER_OS" = "Windows" ]; then
            tar -xf llvm-src.tar.xz -C llvm-src --strip-components=1 --exclude='*/test/*' --exclude='*/unittests/*'
          else
            tar -xf llvm-src.tar.xz -C llvm-src --strip-components=1
          fi
          rm llvm-src.tar.xz

      - name: Install tools (Linux)
        if: matrix.toolchain == 'clang' && (startsWith(matrix.kind, 'linux') || matrix.kind == 'android')
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          if [ "${{ matrix.kind }}" = "linux32" ]; then sudo apt-get install -y gcc-multilib g++-multilib; fi
          if [ "${{ matrix.kind }}" = "linuxarm" ]; then sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf; fi

      - name: Install llvm-mingw (Windows ARM cross)
        if: matrix.kind == 'windowsarm'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          curl -fsSL -o mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/20250709/llvm-mingw-20250709-ucrt-ubuntu-22.04-x86_64.tar.xz"
          mkdir "$HOME/llvm-mingw"
          tar -xf mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Install tools (macOS)
        if: matrix.toolchain == 'clang' && matrix.kind == 'macos'
        run: brew install ninja

      - name: Install tools (Windows ARM64)
        if: matrix.id == 'windows-arm64'
        shell: bash
        run: python -m pip install ninja cmake

      - name: MSVC environment
        if: matrix.toolchain == 'clang' && matrix.kind == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build
        if: matrix.toolchain == 'clang'
        shell: bash
        run: python3 scripts/${{ matrix.toolchain }}.py --kind "${{ matrix.kind }}" --arch "${{ matrix.arch }}" --src llvm-src --work build --out install
        env:
          PYTHONUNBUFFERED: "1"

      - name: Install Android NDK (GCC PS2)
        if: matrix.toolchain == 'gcc-ps2' && matrix.kind == 'android'
        env:
          NDK_VERSION: 27.3.13750724
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_DIR=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build GCC PS2 (Android)
        if: matrix.toolchain == 'gcc-ps2' && matrix.kind == 'android'
        run: |
          docker run --rm -e DEBIAN_FRONTEND=noninteractive -e PYTHONUNBUFFERED=1 -e ANDROID_NDK_HOME=/ndk -v "$NDK_DIR:/ndk:ro" -v "$PWD:/w" -w /w ubuntu:20.04 bash -c 'apt-get -y update && apt-get -y install texinfo bison flex gettext autopoint autoconf automake libtool pkg-config libgmp3-dev libmpfr-dev libmpc-dev g++ gcc git libgsl-dev make patch zlib1g-dev wget curl ca-certificates gpg unzip python3 && (curl -LsSf https://apt.kitware.com/kitware-archive.sh | sh) && apt-get -y install cmake && python3 scripts/gcc_ps2_cross.py --host "android-${{ matrix.arch }}" --out install'

      - name: Build GCC PS2 (Linux)
        if: matrix.toolchain == 'gcc-ps2' && matrix.kind == 'linux'
        run: |
          docker run --rm -e DEBIAN_FRONTEND=noninteractive -e PYTHONUNBUFFERED=1 -v "$PWD:/w" -w /w ubuntu:20.04 bash -c 'apt-get -y update && apt-get -y install texinfo bison flex gettext autopoint autoconf automake libgmp3-dev libmpfr-dev libmpc-dev cmake g++ gcc git libgsl-dev make patch zlib1g-dev wget curl ca-certificates python3 && python3 scripts/gcc_ps2.py --out install'

      - name: Build GCC PS2 (Linux x86 32-bit)
        if: matrix.toolchain == 'gcc-ps2' && matrix.kind == 'linux32'
        run: |
          docker run --rm --platform linux/386 -e DEBIAN_FRONTEND=noninteractive -e PYTHONUNBUFFERED=1 -v "$PWD:/w" -w /w debian:bookworm bash -c 'apt-get -y update && apt-get -y install texinfo bison flex gettext autopoint autoconf automake libgmp3-dev libmpfr-dev libmpc-dev cmake g++ gcc git libgsl-dev make patch zlib1g-dev wget curl ca-certificates python3 && python3 scripts/gcc_ps2.py --out install'

      - name: Build GCC PS2 (Windows cross)
        if: matrix.toolchain == 'gcc-ps2' && matrix.kind == 'wincross'
        run: |
          docker run --rm -e DEBIAN_FRONTEND=noninteractive -e PYTHONUNBUFFERED=1 -v "$PWD:/w" -w /w ubuntu:22.04 bash -c 'apt-get -y update && apt-get -y install texinfo bison flex gettext autopoint autoconf automake libtool pkg-config libgmp3-dev libmpfr-dev libmpc-dev g++ gcc git libgsl-dev make patch zlib1g-dev wget curl ca-certificates xz-utils python3 cmake && mkdir -p /opt/llvm-mingw && curl -fsSL https://github.com/mstorsjo/llvm-mingw/releases/download/20250709/llvm-mingw-20250709-ucrt-ubuntu-22.04-x86_64.tar.xz | tar -xJ -C /opt/llvm-mingw --strip-components=1 && LLVM_MINGW=/opt/llvm-mingw python3 scripts/gcc_ps2_cross.py --host "windows-${{ matrix.arch }}" --out install'

      - name: Build GCC PS2 (Linux ARM 32-bit)
        if: matrix.toolchain == 'gcc-ps2' && matrix.kind == 'linuxarm'
        run: |
          docker run --rm -e DEBIAN_FRONTEND=noninteractive -e PYTHONUNBUFFERED=1 -v "$PWD:/w" -w /w ubuntu:20.04 bash -c 'apt-get -y update && apt-get -y install texinfo bison flex gettext autopoint autoconf automake libtool pkg-config libgmp3-dev libmpfr-dev libmpc-dev g++ gcc gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf git libgsl-dev make patch zlib1g-dev wget curl ca-certificates gpg unzip python3 && (curl -LsSf https://apt.kitware.com/kitware-archive.sh | sh) && apt-get -y install cmake && python3 scripts/gcc_ps2_cross.py --host linux-arm --out install'

      - name: Install tools (GCC PS2, macOS)
        if: matrix.toolchain == 'gcc-ps2' && matrix.kind == 'macos'
        run: brew install texinfo bison flex gnu-sed autoconf automake libtool gsl gmp mpfr libmpc md5sha1sum wget curl

      - name: Build GCC PS2 (macOS)
        if: matrix.toolchain == 'gcc-ps2' && matrix.kind == 'macos'
        run: python3 scripts/gcc_ps2.py --out install
        env:
          PYTHONUNBUFFERED: "1"

      - name: Install MSYS2 (GCC PS2, Windows)
        if: matrix.toolchain == 'gcc-ps2' && matrix.kind == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            base-devel git make texinfo flex bison patch binutils mpc-devel tar wget curl
            autotools gettext gettext-devel python
            mingw-w64-x86_64-readline mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make mingw-w64-x86_64-libogg mingw-w64-x86_64-libsystre
          update: true

      - name: Build GCC PS2 (Windows)
        if: matrix.toolchain == 'gcc-ps2' && matrix.kind == 'windows'
        shell: msys2 {0}
        run: python3 scripts/gcc_ps2.py --out install
        env:
          PYTHONUNBUFFERED: "1"

      - name: Pack
        shell: bash
        run: python3 scripts/common.py pack --root install --top "${{ matrix.toolchain }}" --name "${{ matrix.name }}" --dest dist

      - uses: actions/upload-artifact@v4
        with:
          name: tree-${{ matrix.name }}
          path: dist/*.tree.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: |
            dist/*.tar.xz
            dist/*.sha256
          compression-level: 0

  trees:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: trees-all
          pattern: tree-*
          delete-merged: true

  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Publish to the latest release
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then tag=$(gh release view --json tagName -q .tagName 2>/dev/null || true); fi
          if [ -z "$tag" ]; then tag=v1.0.0; gh release create "$tag" --title "$tag" --notes ""; fi
          gh release download "$tag" --pattern manifest.json --dir dist 2>/dev/null || true
          python3 scripts/common.py manifest --dir dist
          gh release upload "$tag" dist/*.tar.xz dist/manifest.json --clobber
